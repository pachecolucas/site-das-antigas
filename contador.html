<html>
  <head>
    <title>Meu Contador</title>
  </head>
  <body>
    <section>
      <h1>Contador</h1>
      <p>0</p>
      <button onclick="mais()">aumentar</button>
    </section>
    <script>
      let numero = 0;

      function mais() {
        numero++;
        mostrarNaTela();
      }

      function mostrarNaTela() {
        document.querySelector("p").innerText = numero;
      }
    </script>
  </body>
</html>
